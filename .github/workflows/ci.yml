name: CI

# The SOW requires a visible CI run on each pull request. Three jobs, one per
# component, so a reviewer can see at a glance which part of the system a
# change touched and whether it stands up.
#
# The frontend job lints but does not build, and that is a deliberate limit
# rather than an oversight. `lr_frontend/src/functions/KYC/` holds the
# liveness, ID-parsing and face-match logic and is kept out of the public
# repository, but tracked components import it directly — `src/pages/KYC.tsx`
# and three files under `src/elements/KYC/` — so `tsc -b` on a clean clone
# fails on seven missing modules that have nothing to do with any change under
# review. ESLint is configured with `tseslint.configs.recommended`, which is
# syntax-driven and resolves no modules, so it runs clean over all 183 tracked
# frontend files without them. See the job for what that does and does not
# catch.
on:
  push:
    branches: [master, primelendrow]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Soroban contracts. Self-contained crates with their own lockfiles and
  # no database, so this job builds from a clean clone with nothing else set
  # up — it is the one that is green today.
  contracts:
    name: contracts (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - collateral_vault
          - deposit_registry
          - loan_registry
          - payment_registry
    defaults:
      run:
        working-directory: lr_contracts/${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lr_contracts/${{ matrix.contract }}

      # No `cargo fmt --check` anywhere in this workflow. This codebase is
      # hand-formatted on purpose — the multi-line SQL is aligned to be read —
      # and rustfmt currently disagrees with 56 engine files and 12 in the
      # vault. Enforcing it would mean a reformatting commit touching every
      # file of every deliverable, which is the opposite of the reviewable
      # per-deliverable pull requests the SOW asks for. Clippy carries the
      # correctness load instead.
      #
      # Three lints are waived rather than fixed, and only these three. They
      # account for every clippy warning the four contracts produce — 53 of
      # them, none a defect:
      #
      #   inconsistent_digit_grouping     35x  `35333` vs `35_333` in test
      #                                        fixtures
      #   doc_overindented_list_items     16x  doc-comment bullet indentation
      #   needless_borrows_for_generic_args 2x `&env.current_contract_address()`
      #
      # Fixing them means a whitespace-and-underscores commit across contracts
      # that are already deployed to Testnet and are the exact files the SOW
      # points reviewers at. Waiving them here, by name and in the open, keeps
      # `-D warnings` meaningful for everything else: any lint that is not one
      # of these three still fails the build.
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings \
            -A clippy::inconsistent_digit_grouping \
            -A clippy::doc_overindented_list_items \
            -A clippy::needless_borrows_for_generic_args

      # Native, so `soroban-sdk`'s testutils run the contract's own tests.
      - name: Test
        run: cargo test --locked

      # What `stellar contract build` wraps, without paying to install the CLI.
      # The release profile in each manifest keeps overflow checks ON: these
      # contracts hold user funds and a silent wrap is not acceptable.
      - name: Build wasm
        run: cargo build --locked --release --target wasm32v1-none

  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lr_engine
    steps:
      - uses: actions/checkout@v4

      # `lr_engine` uses sqlx with compile-time query verification, so it
      # cannot compile without either a live database or a committed offline
      # cache. The database schema is deliberately not published, which leaves
      # the cache as the only route. Fail here with a usable message rather
      # than 200 lines of macro errors.
      - name: Check for the sqlx offline cache
        run: |
          if [ ! -d .sqlx ] || [ -z "$(ls -A .sqlx 2>/dev/null)" ]; then
            echo "::error::lr_engine/.sqlx is missing from the repository."
            echo "The engine's sqlx macros verify every query at compile time."
            echo "With the schema unpublished, the offline cache is the only way"
            echo "this can build. To fix:"
            echo "  1. remove the 'lr_engine/.sqlx' line from .gitignore"
            echo "  2. run 'cargo sqlx prepare' against the live database"
            echo "  3. commit lr_engine/.sqlx"
            echo "The cache holds query text and column types only - no data,"
            echo "and no SQL that isn't already visible in the Rust source."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lr_engine

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: true

      - name: Test
        run: cargo test --locked
        env:
          SQLX_OFFLINE: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lr_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lr_frontend/package-lock.json

      # Also a check in its own right: `npm ci` fails if package.json and the
      # lockfile have drifted apart.
      - name: Install
        run: npm ci

      # What this catches: unused locals and parameters, React hook rule
      # violations, react-refresh boundary mistakes, and TypeScript syntax
      # errors, across every tracked .ts/.tsx file.
      #
      # What it does NOT catch, and what a reviewer should not read it as
      # covering: type errors. There is no `tsc -b` and no `vite build` here,
      # because both resolve imports and both fail on a clean clone over the
      # unpublished KYC directory (see the note at the top of this file). A
      # green frontend job means the code is well-formed and lint-clean, not
      # that it type-checks or bundles. Those are verified locally until the
      # KYC flow either ships in the repository or moves behind an interface
      # whose implementation is allowed to be absent.
      - name: Lint
        run: npm run lint
